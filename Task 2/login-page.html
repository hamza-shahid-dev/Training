<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page - Task 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="login-container">
      <div class="login-card">
        <div class="login-content">
          <div class="heading">
            <h1>Sign in</h1>
          </div>
          <div class="content">
            <p>Sign in and start managing your candidates!</p>
          </div>
        </div>
        <form class="login-form">
          <div class="input-group">
            <input type="text" placeholder="Login" autocomplete="username" />
          </div>
          <div class="input-group">
            <input
              type="password"
              placeholder="Password"
              autocomplete="current-password"
            />
          </div>
          <div class="login-options">
            <label>
              <input type="checkbox" name="Remember" />Remember me
            </label>
            <a href="#" class="forgot-password"> Forgot Password? </a>
          </div>
          <button type="submit">Login</button>
        </form>
      </div>
    </main>
    <footer>
      <img src="assets/Dark Mode.svg" class="darkmode" />
    </footer>
  </body>
</html>
